name: Release skill zip

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          cd skills
          zip -r -X "../infographic-skill-${TAG}.zip" infographic -x '*.DS_Store'

      - name: Publish release
        run: |
          gh release create "$TAG" "infographic-skill-${TAG}.zip" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
