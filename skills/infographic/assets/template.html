<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Yunex Traffic</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-8.6255 0 56.005 56.005'%3E%3Cdefs%3E%3ClinearGradient id='brand-mark-gradient' x1='0.904' x2='-0.737' y1='1.287' y2='-0.774' gradientUnits='objectBoundingBox'%3E%3Cstop offset='0' stop-color='%23affad7'/%3E%3Cstop offset='0.44' stop-color='%239dbbff'/%3E%3Cstop offset='1' stop-color='%231e2ed9'/%3E%3C/linearGradient%3E%3CclipPath id='brand-mark-clip'%3E%3Cpath d='M3.585 0H45.169V56.005H3.585A10 10 0 0 1-6.415 46.005V10A10 10 0 0 1 3.585 0Z'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23brand-mark-clip)'%3E%3Cpath fill='url(%23brand-mark-gradient)' d='M-4648.054-117.8h-6.686l14.511-19.737 26.36-36.26h6.329l-20.391 28.186 20.4 27.812h-6.031l-16.856-22.928-3.117 4.289 13.7 18.637-28.208-.013-.014.019Zm-11.061-2.578v-50.858l18.7 25.429-18.7 25.427Zm21.832-29.693-17.449-23.728h6.125l.017.021 28.75-.015-17.441 23.722Z' transform='translate(4652.7 173.8)'/%3E%3C/g%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/lucide@1.59.0/dist/umd/lucide.min.js"></script>
  <!-- Charts only: -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media print {
      header { position: static !important; }
      .no-print { display: none !important; }
      section, article, .print-avoid-break { break-inside: avoid; }
    }

    /* ---- Deck: article / slides modes (keep as is) ---- */
    body:not([data-mode="slides"]) .slides-only { display: none !important; }
    body[data-mode="slides"] footer, body[data-mode="slides"] .article-only { display: none !important; }
    body[data-mode="slides"] main [data-panel] { display: contents !important; }
    body[data-mode="slides"] main > :not([data-slide]):not([data-panel]),
    body[data-mode="slides"] main [data-panel] > :not([data-slide]) { display: none !important; }
    body[data-mode="slides"] main [data-slide] { margin-top: auto !important; margin-bottom: auto !important; }
    @media screen {
      body[data-mode="slides"] { height: 100vh; height: 100dvh; overflow: hidden; }
      body[data-mode="slides"] #slide-stage { overflow: auto; }
      body[data-mode="slides"] main { min-height: 100%; display: flex; flex-direction: column; }
      body[data-mode="slides"] main [data-slide]:not(.is-active) { display: none !important; }
      body[data-mode="slides"] main [data-slide].is-active { animation: slide-in .25s ease-out; }
      body.panel-collapsed #slide-panel { display: none !important; }
    }
    @media screen and (max-width: 1023px) {
      #slide-panel { position: absolute; top: 0; bottom: 0; left: 0; z-index: 40; box-shadow: 0 25px 50px -12px rgb(15 23 42 / .25); }
    }
    @media print {
      body[data-mode="slides"] main [data-slide] { break-after: page; }
      main { zoom: 1 !important; width: auto !important; max-width: 80rem !important; }
    }
    @keyframes slide-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { main [data-slide].is-active { animation: none !important; } }
  </style>
</head>
<!-- data-mode: "article" (default) or "slides". Viewer can switch in the header; #slide-3 in the URL opens slide 3. -->
<body data-mode="article" class="bg-slate-50 text-slate-800 font-sans min-h-screen antialiased selection:bg-sky-600 selection:text-white flex flex-col">

  <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur shadow-sm">
    <div class="px-5 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3">
        <svg class="h-11 w-auto shrink-0" viewBox="-6.415 0 51.584 56.005" role="img" aria-label="Yunex Traffic"><defs><linearGradient id="brand-mark-gradient" x1="0.904" x2="-0.737" y1="1.287" y2="-0.774" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#affad7"/><stop offset="0.44" stop-color="#9dbbff"/><stop offset="1" stop-color="#1e2ed9"/></linearGradient><clipPath id="brand-mark-clip"><path d="M3.585 0H45.169V56.005H3.585A10 10 0 0 1-6.415 46.005V10A10 10 0 0 1 3.585 0Z"/></clipPath></defs><g clip-path="url(#brand-mark-clip)"><path fill="url(#brand-mark-gradient)" d="M-4648.054-117.8h-6.686l14.511-19.737 26.36-36.26h6.329l-20.391 28.186 20.4 27.812h-6.031l-16.856-22.928-3.117 4.289 13.7 18.637-28.208-.013-.014.019Zm-11.061-2.578v-50.858l18.7 25.429-18.7 25.427Zm21.832-29.693-17.449-23.728h6.125l.017.021 28.75-.015-17.441 23.722Z" transform="translate(4652.7 173.8)"/></g></svg>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] uppercase font-extrabold tracking-widest text-sky-700 bg-sky-50 px-2 py-0.5 rounded border border-sky-200">{{EYEBROW}}</span>
            <span class="text-xs text-slate-500 font-mono">{{META}}</span>
          </div>
          <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900 mt-0.5">{{TITLE}}</h1>
        </div>
      </div>
      <div class="flex items-center gap-3 no-print">
        <nav data-mode-toggle aria-label="View mode" class="flex gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
          <button type="button" data-mode-btn="article" class="px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition-all"><i data-lucide="file-text" class="w-3.5 h-3.5"></i> Article</button>
          <button type="button" data-mode-btn="slides" class="px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 transition-all"><i data-lucide="presentation" class="w-3.5 h-3.5"></i> Slides</button>
        </nav>
        <button onclick="window.print()" class="px-3.5 py-2 text-xs font-semibold rounded-lg bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 shadow-sm flex items-center gap-1.5 transition active:scale-95">
          <i data-lucide="printer" class="w-4 h-4 text-slate-500"></i> Export / Print
        </button>
      </div>
    </div>
  </header>

  <div id="deck" class="relative flex-1 min-h-0 flex">
    <div class="flex-1 min-w-0 flex flex-col">
      <div id="slide-stage" tabindex="-1" class="flex-1 min-h-0 outline-none">
        <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
          <!-- One <section data-slide="Short title"> per topic. Compose from references/components.md -->
        </main>
      </div>
      <nav class="slides-only no-print shrink-0 border-t border-slate-200 bg-white/90 backdrop-blur">
        <div class="h-0.5 bg-slate-100"><div id="slide-progress" class="h-full bg-sky-600 transition-all duration-300" style="width: 0"></div></div>
        <div class="px-4 sm:px-6 py-2.5 flex items-center gap-3">
          <button type="button" id="panel-toggle" title="Toggle slide panel" class="p-2 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition"><i data-lucide="panel-left" class="w-4 h-4"></i></button>
          <div id="slide-chips" class="min-w-0 flex-1 flex items-center gap-1 overflow-hidden"></div>
          <div id="slide-more-wrap" class="relative hidden">
            <button type="button" id="slide-more" title="All slides" aria-haspopup="true" aria-expanded="false" aria-controls="slide-menu" class="p-2 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition"><i data-lucide="chevron-up" class="w-4 h-4 transition-transform"></i></button>
            <div id="slide-menu" role="menu" class="hidden absolute bottom-full right-0 mb-3 z-50 w-72 max-h-[60vh] overflow-y-auto p-1.5 rounded-xl border border-slate-200 bg-white shadow-xl"></div>
          </div>
          <div role="group" aria-label="Zoom" class="hidden sm:flex items-center rounded-lg border border-slate-200 bg-white shadow-sm">
            <button type="button" id="zoom-out" title="Zoom out (−)" class="p-2 rounded-l-lg text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition disabled:opacity-40 disabled:pointer-events-none"><i data-lucide="zoom-out" class="w-4 h-4"></i></button>
            <button type="button" id="zoom-reset" title="Reset to 100% (0)" class="w-12 py-1.5 font-mono text-[11px] font-semibold text-slate-600 hover:bg-slate-50 hover:text-slate-900 tabular-nums transition">100%</button>
            <button type="button" id="zoom-in" title="Zoom in (+)" class="p-2 text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition disabled:opacity-40 disabled:pointer-events-none"><i data-lucide="zoom-in" class="w-4 h-4"></i></button>
            <button type="button" id="zoom-fit" title="Fit to width (W)" aria-pressed="false" class="p-2 rounded-r-lg border-l border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition aria-pressed:bg-sky-50 aria-pressed:text-sky-700"><i data-lucide="move-horizontal" class="w-4 h-4"></i></button>
          </div>
          <button type="button" id="slide-prev" title="Previous (←)" class="p-2 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-slate-900 shadow-sm transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
          <span id="slide-count" class="whitespace-nowrap font-mono text-xs font-semibold text-slate-500 tabular-nums"></span>
          <button type="button" id="slide-next" title="Next (→)" class="p-2 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-slate-900 shadow-sm transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>
      </nav>
    </div>
    <!-- After <main> in the DOM so document.querySelector() in page code never hits a thumbnail clone -->
    <aside id="slide-panel" aria-label="Slides" class="slides-only no-print order-first w-64 shrink-0 bg-white border-r border-slate-200 flex flex-col">
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <span class="text-[10px] uppercase font-extrabold tracking-widest text-slate-500">Slides</span>
        <span class="text-[10px] font-mono text-slate-400">← → to navigate</span>
      </div>
      <div id="slide-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
    </aside>
  </div>

  <footer class="mt-16 border-t border-slate-200 bg-white py-6 text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>© {{YEAR}} Yunex Traffic</p>
      <div class="flex items-center gap-4 text-slate-400">
        <span>Source: <strong class="text-slate-700">{{SOURCE}}</strong></span>
        <span>•</span>
        <span>{{DATE_LABEL}} <span class="font-mono">{{DATE}}</span></span>
      </div>
    </div>
  </footer>

  <script>
    // ---- Data (single source of truth for everything rendered by JS) ----
    const DATA = {};

    // ---- Helpers ----
    const el = (id) => document.getElementById(id);
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ---- Chart.js house theme (delete block if no charts) ----
    if (window.Chart) {
      Chart.defaults.font.family = 'Inter';
      Chart.defaults.color = '#64748b';
      Chart.defaults.borderColor = '#e2e8f0';
      Chart.defaults.plugins.legend.position = 'bottom';
      Chart.defaults.plugins.legend.labels.boxWidth = 14;
      Chart.defaults.plugins.legend.labels.padding = 16;
      Chart.defaults.plugins.legend.labels.color = '#1e293b';
      Object.assign(Chart.defaults.plugins.tooltip, {
        backgroundColor: '#0f172a', titleColor: '#f8fafc', bodyColor: '#e2e8f0',
        borderColor: '#334155', borderWidth: 1, padding: 10,
      });
    }
    const PALETTE = ['#2563eb', '#10b981', '#8b5cf6', '#f59e0b', '#14b8a6', '#f43f5e', '#06b6d4', '#f97316'];

    // ---- Init ----
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { /* close drawers / modals */ }
    });
  </script>

  <script>
    // ---- Deck: article / slides modes (keep as is; runs after the page script) ----
    (() => {
      const body = document.body;
      const $ = (id) => document.getElementById(id);
      const pad = (n) => String(n).padStart(2, '0');
      const MODE_ON = 'bg-white text-slate-900 font-semibold shadow-sm border border-slate-200/50'.split(' ');
      const MODE_OFF = 'text-slate-600 font-medium hover:text-slate-900 hover:bg-slate-200/50'.split(' ');
      const THUMB_ON = 'bg-sky-50 border-sky-300 ring-2 ring-sky-500/20'.split(' ');
      const THUMB_OFF = 'border-transparent hover:bg-slate-50 hover:border-slate-200'.split(' ');
      const CHIP_ON = 'bg-sky-50 text-sky-800 ring-1 ring-inset ring-sky-200'.split(' ');
      const CHIP_OFF = 'text-slate-500 hover:text-slate-900 hover:bg-slate-100'.split(' ');
      const ITEM_ON = 'bg-sky-50 text-sky-800'.split(' ');
      const ITEM_OFF = 'text-slate-700 hover:bg-slate-50'.split(' ');
      const THUMB_W = 1280, CHIP_GAP = 4;
      const ZOOM_STEPS = [0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
      let slides = [], thumbs = [], chips = [], items = [], current = 0, mode = null, refreshT;
      let zoom = 1, zoomFit = false;

      const headerH = () => document.querySelector('header').offsetHeight;
      const slideTitle = (i) => slides[i].dataset.slide || `Slide ${i + 1}`;
      const slideGroup = (s) => s.closest('[data-panel]')?.dataset.panel ?? null;

      function groupHeader(g, cls) {
        const h = document.createElement('div');
        h.className = `${cls} text-[10px] font-extrabold uppercase tracking-widest text-slate-400`;
        h.textContent = document.querySelector(`[data-tab="${CSS.escape(g)}"]`)?.textContent.trim() || g;
        return h;
      }

      function toggleState(nodes, on, off) {
        nodes.forEach((n, k) => {
          const active = k === current;
          on.forEach((c) => n.classList.toggle(c, active));
          off.forEach((c) => n.classList.toggle(c, !active));
          active ? n.setAttribute('aria-current', 'true') : n.removeAttribute('aria-current');
        });
      }

      function cloneInto(i) {
        const src = slides[i], copy = src.cloneNode(true);
        copy.classList.remove('is-active');
        copy.removeAttribute('data-slide');
        copy.style.margin = '0';
        [copy, ...copy.querySelectorAll('[id]')].forEach((n) => n.removeAttribute('id'));
        const canvases = src.querySelectorAll('canvas');
        copy.querySelectorAll('canvas').forEach((c, k) => { try { c.getContext('2d').drawImage(canvases[k], 0, 0); } catch { /* not drawable yet */ } });
        thumbs[i].querySelector('.thumb-inner').replaceChildren(copy);
      }

      function buildPanel() {
        const list = $('slide-list');
        list.replaceChildren();
        thumbs = [];
        let group = null;
        slides.forEach((s, i) => {
          const g = slideGroup(s);
          if (g && g !== group) list.append(groupHeader(g, 'px-2 pt-3 pb-1'));
          group = g;
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'w-full text-left p-2 rounded-xl border transition';
          b.innerHTML = `<div class="flex items-center gap-2 mb-1.5 px-0.5"><span class="font-mono text-[10px] font-bold text-sky-700">${pad(i + 1)}</span><span class="thumb-title text-xs font-semibold text-slate-700 truncate"></span></div>
            <div class="thumb-frame relative w-full aspect-[16/10] overflow-hidden rounded-lg border border-slate-200 bg-slate-50 pointer-events-none"><div class="thumb-inner absolute top-0 left-0 origin-top-left p-8" inert aria-hidden="true" style="width: ${THUMB_W}px"></div></div>`;
          b.querySelector('.thumb-title').textContent = slideTitle(i);
          b.addEventListener('click', () => { go(i); if (innerWidth < 1024) setPanel(false); });
          list.append(b);
          thumbs.push(b);
          cloneInto(i);
        });
        lucide.createIcons();
        buildBar();
      }

      function buildBar() {
        const bar = $('slide-chips'), menu = $('slide-menu');
        bar.replaceChildren();
        menu.replaceChildren();
        chips = [];
        items = [];
        let group = null;
        slides.forEach((s, i) => {
          const c = document.createElement('button');
          c.type = 'button';
          c.title = slideTitle(i);
          c.className = 'shrink-0 min-w-0 max-w-[11rem] flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition';
          c.innerHTML = `<span class="font-mono text-[10px] font-bold opacity-60">${pad(i + 1)}</span><span class="truncate"></span>`;
          c.lastElementChild.textContent = slideTitle(i);
          c.addEventListener('click', () => go(i));
          bar.append(c);
          chips.push(c);

          const g = slideGroup(s);
          if (g && g !== group) menu.append(groupHeader(g, 'px-2.5 pt-2.5 pb-1'));
          group = g;
          const m = document.createElement('button');
          m.type = 'button';
          m.setAttribute('role', 'menuitem');
          m.className = 'w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-left text-xs font-semibold transition';
          m.innerHTML = `<span class="font-mono text-[10px] font-bold text-sky-700">${pad(i + 1)}</span><span class="truncate"></span>`;
          m.lastElementChild.textContent = slideTitle(i);
          m.addEventListener('click', () => { go(i); setMenu(false); });
          menu.append(m);
          items.push(m);
        });
      }

      // Show every chip if they fit; otherwise the widest window around the current slide plus the "all slides" button.
      function fitChips() {
        if (mode !== 'slides' || !chips.length) return;
        const bar = $('slide-chips'), wrap = $('slide-more-wrap');
        chips.forEach((c) => c.classList.remove('hidden'));
        chips.forEach((c) => c.classList.add('shrink-0'));
        wrap.classList.add('hidden');
        if (bar.scrollWidth <= bar.clientWidth) return;
        wrap.classList.remove('hidden');
        const avail = bar.clientWidth, w = chips.map((c) => c.offsetWidth);
        let lo = current, hi = current, used = w[current];
        for (let grew = true; grew;) {
          grew = false;
          if (hi + 1 < chips.length && used + CHIP_GAP + w[hi + 1] <= avail) { used += CHIP_GAP + w[++hi]; grew = true; }
          if (lo > 0 && used + CHIP_GAP + w[lo - 1] <= avail) { used += CHIP_GAP + w[--lo]; grew = true; }
        }
        chips.forEach((c, k) => c.classList.toggle('hidden', k < lo || k > hi));
        chips[current].classList.remove('shrink-0');
      }

      function setMenu(open) {
        const menu = $('slide-menu'), btn = $('slide-more');
        menu.classList.toggle('hidden', !open);
        btn.setAttribute('aria-expanded', String(open));
        btn.querySelector('svg')?.classList.toggle('rotate-180', open);
        const item = items[current];
        if (open && item) menu.scrollTop = item.offsetTop - (menu.clientHeight - item.offsetHeight) / 2;
      }

      // Zooms <main> only. Its layout width is pinned to the 100% width, so zoom magnifies the slide instead of reflowing it.
      function applyZoom() {
        const main = document.querySelector('main'), stage = $('slide-stage');
        main.style.zoom = main.style.width = main.style.maxWidth = '';
        if (mode !== 'slides') { sharpenCharts(1); return; }
        const base = main.offsetWidth;
        if (zoomFit) zoom = Math.min(ZOOM_STEPS.at(-1), Math.max(ZOOM_STEPS[0], stage.clientWidth / base));
        if (zoom !== 1) Object.assign(main.style, { width: `${base}px`, maxWidth: 'none', zoom: String(zoom) });
        // A vertical scrollbar that appears after zooming narrows the stage; refit once so fit never scrolls sideways.
        if (zoomFit && stage.scrollWidth > stage.clientWidth) { zoom = stage.clientWidth / base; main.style.zoom = String(zoom); }
        sharpenCharts(zoom);
        $('zoom-reset').textContent = `${Math.round(zoom * 100)}%`;
        $('zoom-out').disabled = zoom <= ZOOM_STEPS[0] + 0.001;
        $('zoom-in').disabled = zoom >= ZOOM_STEPS.at(-1) - 0.001;
        $('zoom-fit').setAttribute('aria-pressed', String(zoomFit));
      }

      // Under CSS zoom, pointer offsets arrive in zoomed pixels; map them back so tooltips and hover hit the right element.
      window.Chart?.register({
        id: 'deckZoom',
        beforeEvent(chart, args) {
          const n = args.event.native;
          if (args.replay || !n) return;
          const r = chart.canvas.getBoundingClientRect(), k = r.width / chart.width;
          const pt = n.touches?.[0] ?? n.changedTouches?.[0] ?? n;
          if (Math.abs(k - 1) < 0.01 || pt.clientX == null) return;
          args.event.x = (pt.clientX - r.left) / k;
          args.event.y = (pt.clientY - r.top) / k;
          args.inChartArea = chart.isPointInArea(args.event);
        },
      });

      let chartZoom = 1;
      function sharpenCharts(z) {
        if (!window.Chart || z === chartZoom) return;
        chartZoom = z;
        Object.values(Chart.instances).forEach((c) => { c.options.devicePixelRatio = devicePixelRatio * Math.max(1, z); c.resize(); });
      }

      function setZoom(next) {
        zoomFit = next === 'fit';
        if (next === 'in') zoom = ZOOM_STEPS.find((z) => z > zoom + 0.001) ?? zoom;
        else if (next === 'out') zoom = ZOOM_STEPS.findLast((z) => z < zoom - 0.001) ?? zoom;
        else if (typeof next === 'number') zoom = next;
        applyZoom();
      }

      function sizeThumbs() {
        const w = thumbs[0]?.querySelector('.thumb-frame').clientWidth;
        if (w) thumbs.forEach((t) => { t.querySelector('.thumb-inner').style.transform = `scale(${w / THUMB_W})`; });
      }

      function setPanel(open) {
        body.classList.toggle('panel-collapsed', !open);
        if (open) { sizeThumbs(); thumbs[current]?.scrollIntoView({ block: 'nearest' }); }
        fitChips();
        applyZoom();
      }

      function go(i) {
        const prev = current;
        current = Math.max(0, Math.min(slides.length - 1, i));
        if (prev !== current && slides[prev].classList.contains('is-active')) cloneInto(prev);
        slides.forEach((s, k) => s.classList.toggle('is-active', k === current));
        toggleState(thumbs, THUMB_ON, THUMB_OFF);
        toggleState(chips, CHIP_ON, CHIP_OFF);
        toggleState(items, ITEM_ON, ITEM_OFF);
        fitChips();
        thumbs[current].scrollIntoView({ block: 'nearest' });
        applyZoom();
        $('slide-stage').scrollTo(0, 0);
        $('slide-count').textContent = `${pad(current + 1)} / ${pad(slides.length)}`;
        $('slide-progress').style.width = `${((current + 1) / slides.length) * 100}%`;
        $('slide-prev').disabled = current === 0;
        $('slide-next').disabled = current === slides.length - 1;
        history.replaceState(null, '', `#slide-${current + 1}`);
        clearTimeout(refreshT);
        refreshT = setTimeout(() => cloneInto(current), 1100);
      }

      function nearestSlide() {
        const top = headerH() + 8;
        const k = slides.findIndex((s) => s.offsetParent !== null && s.getBoundingClientRect().bottom > top);
        return Math.max(0, k);
      }

      function revealInArticle(s) {
        const panel = s.closest('[data-panel]');
        if (panel?.classList.contains('hidden') && typeof window.switchTab === 'function') window.switchTab(panel.dataset.panel);
        const y = current === 0 ? 0 : s.getBoundingClientRect().top + scrollY - headerH() - 16;
        scrollTo({ top: y, behavior: 'instant' });
      }

      function setMode(next, start) {
        if (next === 'slides') {
          if (mode !== 'slides') { buildPanel(); current = start ?? nearestSlide(); }
          body.dataset.mode = mode = 'slides';
          sizeThumbs();
          go(current);
        } else {
          clearTimeout(refreshT);
          setMenu(false);
          const wasSlides = mode === 'slides';
          body.dataset.mode = mode = 'article';
          applyZoom();
          history.replaceState(null, '', location.pathname + location.search);
          if (wasSlides) revealInArticle(slides[current]);
        }
        document.querySelectorAll('[data-mode-btn]').forEach((b) => {
          const on = b.dataset.modeBtn === mode;
          MODE_ON.forEach((c) => b.classList.toggle(c, on));
          MODE_OFF.forEach((c) => b.classList.toggle(c, !on));
          b.setAttribute('aria-pressed', String(on));
        });
      }

      const hashSlide = () => location.hash.match(/^#slides?(?:-(\d+))?$/);

      document.addEventListener('DOMContentLoaded', () => {
        slides = [...document.querySelectorAll('main [data-slide]')].filter((s) => !s.parentElement.closest('[data-slide]'));
        if (!slides.length) { document.querySelector('[data-mode-toggle]').remove(); body.dataset.mode = 'article'; return; }

        document.querySelectorAll('[data-mode-btn]').forEach((b) => b.addEventListener('click', () => {
          setMode(b.dataset.modeBtn);
          if (mode === 'slides') $('slide-stage').focus({ preventScroll: true });
        }));
        $('slide-prev').addEventListener('click', () => go(current - 1));
        $('slide-next').addEventListener('click', () => go(current + 1));
        $('panel-toggle').addEventListener('click', () => setPanel(body.classList.contains('panel-collapsed')));
        $('slide-more').addEventListener('click', () => setMenu($('slide-menu').classList.contains('hidden')));
        document.addEventListener('click', (e) => { if (!e.target.closest('#slide-more-wrap')) setMenu(false); });
        $('zoom-in').addEventListener('click', () => setZoom('in'));
        $('zoom-out').addEventListener('click', () => setZoom('out'));
        $('zoom-reset').addEventListener('click', () => setZoom(1));
        $('zoom-fit').addEventListener('click', () => setZoom(zoomFit ? 1 : 'fit'));
        addEventListener('resize', () => { sizeThumbs(); fitChips(); applyZoom(); });
        document.fonts?.ready.then(() => { fitChips(); applyZoom(); });
        addEventListener('hashchange', () => {
          const m = hashSlide();
          if (!m) return;
          const i = m[1] ? m[1] - 1 : 0;
          mode === 'slides' ? go(i) : setMode('slides', i);
        });

        document.addEventListener('keydown', (e) => {
          if (mode !== 'slides' || e.altKey || e.ctrlKey || e.metaKey) return;
          if (e.key === 'Escape' && !$('slide-menu').classList.contains('hidden')) { setMenu(false); $('slide-more').focus(); return; }
          if (e.target.closest('input, textarea, select, [contenteditable]')) return;
          const step = { ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1 }[e.key];
          if (step) go(current + step);
          else if (e.key === 'Home') go(0);
          else if (e.key === 'End') go(slides.length - 1);
          else if (e.key === '+' || e.key === '=') setZoom('in');
          else if (e.key === '-' || e.key === '_') setZoom('out');
          else if (e.key === '0') setZoom(1);
          else if (e.key === 'w' || e.key === 'W') setZoom(zoomFit ? 1 : 'fit');
          else return;
          e.preventDefault();
        });

        let tx = null, ty = 0;
        const stage = $('slide-stage');
        stage.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
        stage.addEventListener('touchend', (e) => {
          if (mode !== 'slides' || tx === null || e.target.closest('.overflow-x-auto')) return;
          const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
          tx = null;
          if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) go(current + (dx < 0 ? 1 : -1));
        });

        if (innerWidth < 1024) body.classList.add('panel-collapsed');
        const m = hashSlide();
        if (m || body.dataset.mode === 'slides') setMode('slides', m?.[1] ? m[1] - 1 : 0);
        else setMode('article');
      });
    })();
  </script>
</body>
</html>
